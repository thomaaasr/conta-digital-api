spring.application.name=conta-digital-api

# Lê o arquivo .env (formato CHAVE=valor), se existir. Variáveis do ambiente têm prioridade.
spring.config.import=optional:file:.env[.properties]

# Banco de dados. Os valores depois do ":" são o padrão quando a variável não existe.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/contadigital}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# Quem cria e altera as tabelas é o Flyway; o Hibernate só confere se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Expõe só o endpoint de saúde do Actuator: GET /actuator/health
management.endpoints.web.exposure.include=health
